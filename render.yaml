services:
  - type: web
    name: snaplab-events-demo
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SITE_ORIGIN
        value: https://walidoux.github.io
